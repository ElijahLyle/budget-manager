openapi: 3.0.4
info:
  title: Budget Manager API
  description: >-
    Endpoints for the Budget Manager application (MVP). Write methods are unauthenticated until post-MVP v1.0. See rest-api.md for business process.
  version: 0.1.0

servers: 
  - url: https://api.example.com/api/v1
    description: Only server

tags:
  - name: Users
  - name: Accounts
  - name: Categories
  - name: Transactions
  - name: Summaries

paths:
  /users:
    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the new user
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
  
  /users/{userId}:
    get:
      tags: [Users]
      summary: Get a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses: 
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{userId}/accounts:
    get:
      tags: [Accounts]
      summary: List a user's accounts
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses: 
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Accounts]
      summary: Create a new account for a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the new account
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /categories:
    get:
      tags: [Categories]
      summary: List categories
      parameters:
        - in: query
          name: type
          required: false
          description: Only categories of this type
          schema:
            $ref: "#/components/schemas/FlowType"
      responses: 
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses: 
        "201":
          description: Created
          headers:
            Location:
              description: URL of the new category
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{userId}/transactions:
    get:
      tags: [Transactions]
      summary: List and filters a user's transactions
      parameters:
        - $ref: "#/components/parameters/UserId"
        - in: query
          name: from
          required: false
          description: Start date, inclusive
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: false
          description: End date, inclusive
          schema:
            type: string
            format: date
        - in: query
          name: accountId
          required: false
          schema:
            type: integer
            format: int64
        - in: query
          name: categoryId
          required: false
          schema:
            type: integer
            format: int64
        - in: query
          name: type
          required: false
          schema:
            $ref: "#/components/schemas/FlowType"
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses: 
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Transactions]
      summary: Creates a transaction
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the new transaction
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{userId}/transactions/{transactionId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/TransactionId"
    get:
      tags: [Transactions]
      summary: Get one transaction
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [Transactions]
      summary: Update a transaction (full replacement)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Transactions]
      summary: Delete a transaction
      responses:
        "204":
          description: Deleted, no content
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{userId}/summaries/monthly:
    get:
      tags: [Summaries]
      summary: Monthly income, expense and net balance
      parameters:
        - $ref: "#/components/parameters/UserId"
        - in: query
          name: year
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
          example: 2026
        - in: query
          name: month
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
          example: 10
      responses:
        "200":
          description: OK (zeros if the month has no transactions)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlySummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  parameters:
    UserId:
      in: path
      name: userId
      required: true
      description: The user ID
      schema:
        type: integer
        format: int64
    TransactionId:
      in: path
      name: transactionId
      required: true
      description: The transaction ID
      schema:
        type: integer
        format: int64
    
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Duplicate value or resource still in use
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    FlowType:
      type: string
      enum: [INCOME, EXPENSE]

    Audit:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        changeNo:
          type: integer
          readOnly: true

    UserCreate:
      type: object
      required: [userName, password, firstName, lastName, email]
      properties:
        userName:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[A-Za-z0-9_.-]+$"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 7
          maxLength: 20
          pattern: "^[0-9+ -]+$"

    User:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              format: int64
              readOnly: true
            userName:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
              format: email
            phone:
              type: string
            status:
              type: string
              enum: [ACTIVE, INACTIVE]
              readOnly: true
            currency:
              pattern: "^[A-Z]{3}$"
              description: ISO 4217 code
              example: PHP
        - $ref: "#/components/schemas/Audit"

    AccountCreate:
      type: object
      required: [name, type, currency]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          enum: [CASH, BANK, CREDIT_CARD, E_WALLET]
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code
          example: PHP
    
    Account:
      allOf:
      - type: object
        properties:
          id:
            type: integer
            format: int64
            readOnly: true
          userId:
            type: integer
            format: int64
            readOnly: true
      - $ref: "#/components/schemas/AccountCreate"
      - $ref: "#/components/schemas/Audit"

    CategoryCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: "#/components/schemas/FlowType"
        description:
          type: string
          maxLength: 255
      
    Category:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              format: int64
              readOnly: true
        - $ref: "#/components/schemas/CategoryCreate"
        - $ref: "#/components/schemas/Audit"

    TransactionInput:
      type: object
      required: [accountId, categoryId, type, amount, transactionDate]
      properties:
        accountId:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
          description: Category type must match the transaction type
        type:
          $ref: "#/components/schemas/FlowType"
        amount:
          type: number
          multipleOf: 0.01
          minimum: 0
          exclusiveMinimum: true
          description: Always positive; the sign is carried by type
          example: 1250.75
        transactionDate:
          type: string
          format: date
          example: "2026-10-25"
        transactionTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$"
          example: "18:30:00"
        description:
          type: string
          maxLength: 255
        note:
          type: string
          maxLength: 1000

    Transaction:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              format: int64
              readOnly: true
            userId:
              type: integer
              format: int64
              readOnly: true
        - $ref: "#/components/schemas/TransactionInput"
        - $ref: "#/components/schemas/Audit"
    TransactionPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    MonthlySummary:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        totalIncome:
          type: number
          multipleOf: 0.01
        totalExpense:
          type: number
          multipleOf: 0.01
        netBalance:
          type: number
          multipleOf: 0.01
          description: totalIncome minus totalExpense; may be negative

    Error:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation failed
        path:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string